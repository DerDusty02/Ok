<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nicos Kochbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Frischer Markt. Kräutergrüne Kopfleiste mit sonnengelbem Akzent, darunter eine helle,
   leicht minzige Arbeitsfläche; Rezepte als weiße Karten mit weichen Ecken, Nährwerte im Stil der
   deutschen Nährwerttabelle. Makros: Eiweiß = Petrol, Kohlenhydrate = Sonnengelb, Fett = Tomate.
   Bewusst nur ein helles Thema: Das Kochbuch soll immer frisch wirken, auch im Dark Mode. */
:root{
  --bg:#F5F9F2;
  --surface:#FFFFFF;
  --sunk:#EAF2E5;
  --ink:#1D2B22;
  --muted:#5B6B5F;
  --line:#D7E4D0;
  --accent:#1F8A4C;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0F2E4;
  --head:#1B6E40;
  --head-ink:#FFFFFF;
  --head-muted:#CDE7D5;
  --sun:#FFD45C;
  --sun-ink:#1D2B22;
  --spice:#E2553A;
  --p:#1F9A8A;
  --k:#F2B233;
  --f:#E8674C;
  --danger:#C93838;
  --toast-bg:#1B6E40;
  --toast-fg:#FFFFFF;
  --s-good:#22863F;
  --s-mid:#B26E08;
  --s-low:#C93838;
  --s-ink:#FFFFFF;
  --s-good-bg:#DDF2E2;
  --s-mid-bg:#FCEFD3;
  --s-low-bg:#FBE2E0;
  --shadow:0 1px 2px rgba(27,110,64,.06),0 8px 24px rgba(27,110,64,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3,h4{margin:0}
p{margin:0}
.wrap{max-width:1140px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top :focus-visible{outline-color:var(--sun)}
button{font:inherit;color:inherit}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);box-shadow:0 2px 12px rgba(27,110,64,.18)}
.brand-leaf{width:1.05em;height:1.05em;flex:none}
.btn.btn-sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);flex:none}
.btn.btn-sun:hover{border-color:var(--head-ink)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,1.2rem + 1.2vw,2rem);line-height:1.1;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:var(--head-ink)}
.brand-meta{margin-top:3px;color:var(--head-muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:none;font-weight:700;color:var(--head-muted);padding:10px 10px 11px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--head-ink)}
.tabs button[aria-current="page"]{color:var(--head-ink);border-bottom-color:var(--sun)}
.badge{font-family:var(--f-num);font-size:.72rem;font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:1px 7px;line-height:1.4;font-variant-numeric:tabular-nums}
.badge:empty{display:none}
@media (max-width:520px){
  .top-row{padding-block:10px 2px}
  .brand-name{font-size:1.35rem}
  .brand-meta{display:none}
  .btn.btn-sun{padding:8px 13px;font-size:.88rem}
}

/* Bausteine */
.page{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-h > div:first-child{min-width:0;flex:1 1 280px;display:flex;flex-direction:column;gap:4px}
.page-title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,1.3rem + 1.4vw,2.2rem);line-height:1.15;text-wrap:balance}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.2}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;font-weight:700;font-size:.95rem;border-radius:999px;padding:9px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{border-color:var(--line)}
.btn-danger{color:var(--danger)}
.btn-danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn-mini{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn-mini:hover{border-color:var(--ink)}
.back{appearance:none;border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;padding:4px 0;align-self:flex-start}
.back:hover{color:var(--ink)}
.x{appearance:none;border:1.5px solid transparent;background:none;color:var(--muted);cursor:pointer;border-radius:8px;width:36px;height:36px;font-size:1.25rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none}
.x:hover{color:var(--danger);border-color:var(--line)}
.link{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.alert{border-color:var(--danger)}
.hint{color:var(--muted);font-size:.88rem}
.hint .link{font-weight:700;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.preview-h{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

input[type=text],input[type=number],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;line-height:1.5}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.88rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.field > label, .field legend{font-weight:700;font-size:.88rem;padding:0}
.field-hint{font-weight:400;color:var(--muted);font-size:.78rem}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:700}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.form-grid .wide{grid-column:1/-1}
.inline-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.inline-form label{flex:1 1 150px;min-width:0}
.inline-form label.narrow{flex:0 1 120px}
.inline-form label.check{flex:0 1 auto;padding-bottom:10px}
.err{color:var(--danger);font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;background:var(--sunk);flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* Rezeptliste */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{flex:1 1 260px}
.toolbar .sortl{flex:0 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 2px 4px rgba(27,110,64,.08),0 14px 32px rgba(27,110,64,.14)}
.card h3{font-family:var(--f-display);font-weight:700;font-size:1.22rem;line-height:1.22;text-wrap:balance}
.card h3 button{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.card h3 button::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;min-height:1.2rem}
.tag{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.card-meta{color:var(--muted);font-size:.88rem}
.card-fit{font-size:.84rem;font-weight:700;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:4px 8px}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.card-stats{display:flex;flex-direction:column;gap:2px;font-size:.8rem;font-weight:700;margin-right:auto;margin-left:6px;min-width:0;font-variant-numeric:tabular-nums}
.kcal-big{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kcal-unit{font-size:.75rem;color:var(--muted);margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.p{background:var(--p)} .dot.k{background:var(--k)} .dot.f{background:var(--f)}
.ring,.prof-mini{flex:none;display:block}
.loading{color:var(--muted);padding:24px 0}

/* Detail */
.detail-head{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.detail-title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.85rem,1.3rem + 2.2vw,2.75rem);line-height:1.08;letter-spacing:-.01em;text-wrap:balance;max-width:22ch}
.lead{max-width:62ch;color:var(--muted);font-size:1.05rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.92rem;color:var(--muted)}
.facts b{font-family:var(--f-num);font-weight:600;color:var(--ink);font-size:1.05rem}
.detail-grid{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:36px;padding-top:4px}
@media (max-width:820px){.detail-grid{grid-template-columns:minmax(0,1fr);gap:28px}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h3{font-family:var(--f-display);font-weight:700;font-size:1.35rem}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.stepper button{appearance:none;border:0;background:none;width:38px;height:36px;font-size:1.2rem;cursor:pointer;color:var(--ink);border-radius:999px}
.stepper button:hover{background:var(--sunk)}
.stepper output{font-family:var(--f-num);font-weight:600;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper span{font-size:.85rem;color:var(--muted);padding-right:4px}
.zl{display:grid;grid-template-columns:auto minmax(0,1fr);margin:0;padding:0;list-style:none}
.zl li{display:contents}
.zl .m,.zl .n{padding:8px 0;border-bottom:1px solid var(--line)}
.zl .m{font-family:var(--f-num);font-size:.88rem;text-align:right;white-space:nowrap;padding-right:14px;font-variant-numeric:tabular-nums}
.zl .n{min-width:0}
.note{color:var(--muted);font-size:.88rem}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:2px}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.4rem minmax(0,1fr);align-items:start;border-radius:8px}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.2;color:var(--spice);padding:10px 0 0 6px}
.steps button{appearance:none;border:0;background:none;text-align:left;cursor:pointer;padding:12px 10px 12px 2px;font-size:1.05rem;line-height:1.55;color:var(--ink);max-width:66ch}
.steps li:hover{background:var(--sunk)}
.steps li.done button{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.steps li.done::before{color:var(--muted)}

/* Nährwerttabelle */
.label{border:2px solid var(--ink);border-radius:4px;padding:10px 12px 12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.label-h{font-weight:700;font-size:1.05rem;border-bottom:6px solid var(--ink);padding-bottom:6px}
.label table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.label th,.label td{padding:6px 0;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-size:.92rem}
.label th:first-child{text-align:left}
.label tr.sub th{padding-left:14px;font-weight:400}
.label thead th{font-size:.78rem;color:var(--muted);font-weight:700;border-bottom:2px solid var(--ink)}
.label td{font-family:var(--f-num);padding-left:10px;line-height:1.35}
.label tbody tr:first-child td{font-weight:600}
.mbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.mbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.label-foot{font-size:.78rem;color:var(--muted)}
.warn{font-size:.85rem;color:var(--danger)}

/* Profil */
.score{display:inline-flex;align-items:baseline;gap:1px;font-family:var(--f-num);font-weight:600;font-size:.88rem;padding:2px 9px;border-radius:999px;color:var(--s-ink);background:var(--muted);white-space:nowrap;line-height:1.45;flex:none}
.score small{font-size:.68rem;opacity:.85}
.score.s-good{background:var(--s-good)} .score.s-mid{background:var(--s-mid)} .score.s-low{background:var(--s-low)}
.scorebox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:16px}
.score-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score-top.s-good{color:var(--s-good)} .score-top.s-mid{color:var(--s-mid)} .score-top.s-low{color:var(--s-low)}
.score-num{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.02em}
.score-num small{font-family:var(--f-body);font-size:1rem;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;flex:1 1 160px;min-width:0}
.scale i{height:14px;border-radius:3px;background:var(--sunk);display:block}
.scale i.on{background:currentColor}
.crits{display:flex;flex-direction:column;gap:12px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:baseline}
.crit-name{font-weight:700;font-size:.95rem}
.crit-pts{font-family:var(--f-num);font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.crit-pts.s-good{color:var(--s-good)} .crit-pts.s-mid{color:var(--s-mid)} .crit-pts.s-low{color:var(--s-low)}
.crit-bar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;display:block}
.crit-bar span{display:block;height:100%;background:var(--ink)}
.crit-bar span.s-good{background:var(--s-good)} .crit-bar span.s-mid{background:var(--s-mid)} .crit-bar span.s-low{background:var(--s-low)}
.crit-why{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.crit-miss{grid-column:1/-1;font-size:.8rem;color:var(--danger)}
.tipps{margin:6px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
details.how summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted)}
details.how summary:hover{color:var(--ink)}
details.how ul{margin:8px 0 0;padding-left:1.1em;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
details.how p{margin-top:8px}

/* Wochenplan */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.daybtn{appearance:none;flex:1 0 84px;min-width:84px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.daybtn.wide{flex-basis:104px}
.daybtn:hover{border-color:var(--ink)}
.daybtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.db-name{font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.db-today{font-style:normal;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 5px;line-height:1.5}
.db-meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.db-bars{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.db-bars i{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.db-bars b{display:block;height:100%;background:var(--k);border-radius:2px}
.db-bars b.full{background:var(--s-good)}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,390px);gap:24px;align-items:start}
@media (max-width:880px){.plan-grid{grid-template-columns:minmax(0,1fr)}}
.slots{display:flex;flex-direction:column}
.slot{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:8px}
.slot-h{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.slot-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.free{color:var(--muted);font-size:.88rem}
.entry{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.entry.editing{display:block;background:var(--sunk);border-radius:8px;padding:10px}
.entry-main{min-width:0;display:flex;flex-direction:column;gap:2px}

/* ---------- Speicher ---------- */
const queues = {};
async function mitRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 700)); return await fn(); }
    throw e;
  }
}
function fehlerText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Der Speicher ist voll. Lösche alte Rezepte oder Zutaten.';
  if (c === 'invalid_argument' || c === 'not_granted' || c === 'revoked') return 'Speichern ist hier nicht erlaubt. Du kannst das Kochbuch nur ansehen.';
  return 'Speichern hat nicht geklappt. Versuch es gleich noch einmal.';
}
function speichern(path, data) {
  if (!S.db) { toast('Speichern geht nur im geöffneten Kochbuch in Claude.'); return; }
  const q = queues[path] || (queues[path] = { busy: false, next: null, quiet: 0 });
  q.next = clone(data);
  q.quiet = Date.now() + 1500;
  if (!q.busy) pump(path);
}
async function pump(path) {
  const q = queues[path];
  q.busy = true;
  while (q.next) {
    const d = q.next; q.next = null;
    try { await mitRetry(() => S.db.doc(path).set(d)); }
    catch (e) { toast(fehlerText(e)); }
  }
  q.busy = false;
  q.quiet = Date.now() + 900;
}
const ruhig = path => { const q = queues[path]; return !q || (!q.busy && !q.next && Date.now() > q.quiet); };
async function setDoc(path, data) { return mitRetry(() => S.db.doc(path).set(clone(data))); }
async function delDoc(path) { return mitRetry(() => S.db.doc(path).delete()); }
function planSpeichern() { speichern('plan/woche', { eintraege: S.plan.eintraege }); updHeader(); }

/* ---------- Abgeleitete Daten ---------- */
function rebuildIndex() {
  S.nameIndex = new Map();
  const gr = new Map();
  for (const z of S.zutaten.values()) {
    S.nameIndex.set(String(z.name).trim().toLowerCase(), z.id);
    const k = gKey(z);
    if (!k) continue;
    if (!gr.has(k)) gr.set(k, { key: k, name: String(z.gruppe).trim(), ids: [] });
    gr.get(k).ids.push(z.id);
  }
  for (const g of gr.values()) g.ids.sort((a, b) => String(S.zutaten.get(a).name).localeCompare(String(S.zutaten.get(b).name), 'de'));
  S.gruppen = gr;
}
const findeZutat = name => S.nameIndex.get(String(name || '').trim().toLowerCase()) || null;
function sortierteRezepte() { return [...S.rezepte.values()].sort((a, b) => String(a.titel).localeCompare(String(b.titel), 'de')); }
function nutzung() {
  const m = new Map();
  for (const r of S.rezepte.values()) for (const l of r.zutaten || []) m.set(l.zutat, (m.get(l.zutat) || 0) + 1);
  for (const e of S.plan.eintraege) if (e.typ === 'lebensmittel') m.set(e.zutat, (m.get(e.zutat) || 0) + 1);
  return m;
}
const FAM = { g: 'masse', kg: 'masse', ml: 'vol', l: 'vol', stk: 'stk', el: 'loeffel', tl: 'loeffel', prise: 'prise' };
function einkaufsItems() {
  const items = new Map();
  const add = (id, part, quelle) => {
    if (!items.has(id)) items.set(id, { id, z: S.zutaten.get(id), parts: [], rezepte: new Set() });
    const it = items.get(id); it.parts.push(part); it.rezepte.add(quelle);
  };
  for (const e of S.plan.eintraege) {
    const mult = e.tag === 'taeglich' ? 7 : 1;
    if (e.typ === 'lebensmittel') {
      if (e.einkaufen) add(e.zutat, { menge: (+e.menge || 0) * mult, einheit: e.einheit }, mult > 1 ? 'Jeden Tag' : 'Einzeln geplant');
      continue;
    }
    const r = S.rezepte.get(e.rezept);
    if (!r || !(e.kochen > 0)) continue;
    const fak = e.kochen * mult / Math.max(1, +r.portionen || 1);
    for (const l of effZutaten(r)) add(l.zutat, { menge: (Number(l.menge) || 0) * fak, einheit: l.einheit }, r.titel);
  }
  const out = [];
  for (const it of items.values()) {
    it.menge = mengeText(it);
    it.name = it.z ? it.z.name : it.id;
    it.kat = (it.z && KAT_NAME[it.z.kategorie]) ? it.z.kategorie : 'sonstiges';
    it.basic = !!(it.z && it.z.basic);
    out.push(it);
  }
  return out.sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
function mengeText(it) {
  const fams = {};
  for (const p of it.parts) {
    const f = FAM[p.einheit] || 'x';
    let v = p.menge;
    if (p.einheit === 'kg' || p.einheit === 'l') v *= 1000;
    if (p.einheit === 'el') v *= 3;
    fams[f] = (fams[f] || 0) + v;
  }
  const keys = Object.keys(fams);
  if (keys.length > 1 && it.z) {
    let total = 0, ok = true;
    for (const p of it.parts) { const g = gramm(p, it.z); if (g == null) { ok = false; break; } total += g; }
    if (ok) return '≈ ' + fmtMenge(total, 'g');
  }
  return keys.map(f => {
    const v = fams[f];
    if (f === 'masse') return fmtMenge(v, 'g');
    if (f === 'vol') return fmtMenge(v, 'ml');
    if (f === 'stk') return fmtMenge(v, 'stk', it.z);
    if (f === 'loeffel') return v >= 3 ? fmtMenge(v / 3, 'el') : fmtMenge(v, 'tl');
    if (f === 'prise') return fmtMenge(v, 'prise');
    return num(v, 1);
  }).join(' + ');
}
function offeneArtikel() {
  const items = einkaufsItems().filter(i => !i.basic);
  return items.filter(i => !S.liste.abgehakt[i.id]).length + (S.liste.extras || []).filter(x => !x.done).length;
}

function fokusWerte(r, pr, f, maxFit) {

  o.zeit = hat(r.zeit) && +r.zeit > 0 ? clamp((60 - +r.zeit) / 45, 0, 1) * 10 : 0;

  return o;

  });
  const maxFit = Math.max(0, ...rows.map(x => x.f ? x.f.s : 0));
  rows.forEach(x => {
    x.fw = fokusWerte(x.r, x.pr, x.f, maxFit);

  return rows;
}

    if (!q) return true;
    const namen = [...(r.zutaten || []), ...effZutaten(r)].map(l => (S.zutaten.get(l.zutat) || {}).name || '');
    const hay = [r.titel, r.beschreibung, ...(r.tags || []), ...namen].join(' ').toLowerCase();
    return hay.includes(q);
  }));
  const vorFilter = rows.length;
  if (fokusAktiv && S.nurTreffer) rows = rows.filter(x => x.fs >= 7);
  const g = x => x.pr ? x.pr.gesamt : -1;
  const by = {
    fokus: (a, b) => ((b.fs || 0) - (a.fs || 0)) || (g(b) - g(a)),
    name: (a, b) => String(a.r.titel).localeCompare(String(b.r.titel), 'de'),
    gesamt: (a, b) => g(b) - g(a),
    eiweiss: (a, b) => b.n.p - a.n.p,
    gemuese: (a, b) => b.n.vg - a.n.vg,
    kcal: (a, b) => a.n.kcal - b.n.kcal,
    zeit: (a, b) => (+a.r.zeit || 9999) - (+b.r.zeit || 9999)
  };
  rows.sort(by[S.sort] || by.name);
  if (!rows.length) {
    $('#liste').innerHTML = vorFilter
      ? `<div class="empty"><strong>Kein starker Treffer</strong><p>Kein Rezept erreicht mindestens 7 für ${esc(liste(S.fokus.map(k => FOKUS_NAME[k])))}. Nimm „Nur starke Treffer“ raus oder wähl weniger Punkte aus.</p></div>`
      : `<div class="empty"><strong>Nichts gefunden</strong><p>Kein Rezept passt zu „${esc(S.suche)}“${S.tag ? ' in „' + esc(S.tag) + '“' : ''}.</p></div>`;
    return;
  }
  $('#liste').innerHTML = `<div class="grid">${rows.map(x => {
    const { r, pr, n, f } = x;
    const getauscht = effZutaten(r).filter(l => l.statt).map(l => (S.zutaten.get(l.zutat) || {}).name).filter(Boolean);
    const pill = fokusAktiv
      ? `<span class="score ${scoreKlasse(x.fs)}" title="Treffer für deinen Fokus: ${num(x.fs, 1)} von 10">${num(x.fs, 1)}<small>/10</small></span>`
      : scorePill(pr);
    return `
    <article class="card">
      <div class="card-top"><div class="card-tags">${(r.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>${pill}</div>
      <h3><button type="button" data-open="${esc(r.id)}">${esc(r.titel)}</button></h3>
      <p class="card-meta">${r.zeit ? esc(r.zeit) + ' Min · ' : ''}${esc(r.portionen)} ${+r.portionen === 1 ? 'Portion' : 'Portionen'}${getauscht.length ? ' · mit ' + esc(liste(getauscht)) : ''}</p>
      ${fokusAktiv ? fokusZeile(x) : ''}
      ${f ? `<p class="card-fit">Heute: ${esc(f.text)}</p>` : ''}
      <div class="card-foot">
        <div><div class="kcal-big">${num(n.kcal)}</div><div class="kcal-unit">kcal pro Portion</div></div>
        <div class="card-stats"><span>${num(n.p)} g Eiweiß</span><span>${num(n.vg)} g Gemüse &amp; Obst</span></div>
        ${miniProfil(pr)}
      </div>
    </article>`;
  }).join('')}</div>`;
}

/* ---------- Ansicht: Rezept ---------- */
function labelHtml(t, basis, port) {
  const pp = k => t[k] / basis;
  const e = v => `${num(v * 4.184)} kJ<br>${num(v)} kcal`;

  const row = (name, k, sub, fmt = g) => `<tr${sub ? ' class="sub"' : ''}><th scope="row">${name}</th><td>${fmt(pp(k))}</td><td>${fmt(pp(k) * port)}</td></tr>`;
  const ohne = [...new Set([...t.fehlt, ...t.ohne.fett, ...t.ohne.ball, ...t.ohne.salz])];
  return `<section class="label" aria-label="Nährwerte">
    <div class="label-h">Nährwerte</div>
    <table>
      <thead><tr><th scope="col"><span class="sr">Nährstoff</span></th><th scope="col">pro Portion</th><th scope="col">${port} ${port === 1 ? 'Portion' : 'Portionen'}</th></tr></thead>
      <tbody>
        ${row('Brennwert', 'kcal', false, e)}
        ${row('Fett', 'f')}${row('davon gesättigte Fettsäuren', 'sfa', true)}
        ${row('Kohlenhydrate', 'k')}${row('davon Zucker', 'zucker', true)}
        ${row('Ballaststoffe', 'ball')}
        ${row('Eiweiß', 'p')}
        ${row('Salz', 'salz')}
      </tbody>
    </table>
    ${mbar(t)}
    ${ohne.length ? `<p class="warn">Unvollständig: Bei ${esc(ohne.join(', '))} fehlen Angaben. Trag sie unter „Zutaten &amp; Nährwerte“ nach.</p>` : '<p class="label-foot">Richtwerte, berechnet aus den Rohgewichten der Zutaten.</p>'}
  </section>`;
}

      ${S.delAsk ? `<div class="panel alert"><p>„${esc(r.titel)}“ endgültig löschen? Einträge im Wochenplan verschwinden mit.</p>

  $('#pMinus').onclick = () => { S.portionen[r.id] = Math.max(1, port - 1); viewDetail(); };

  $('#aEdit').onclick = () => bearbeiten(r.id);
  $('#aDel').onclick = () => { S.delAsk = true; viewDetail(); };
  $('#aKoch').onclick = kochmodus;
  main.querySelectorAll('[data-swap]').forEach(b => b.onclick = () => {

  if (sStd) sStd.onclick = () => {
    const names = [];
    for (const [orig, to] of Object.entries(eigeneVarianten(r) || {})) {
      const g = gruppeVon(orig);
      if (!g || !g.ids.includes(to)) continue;
      S.var.standard[g.key] = to;
      names.push(`${g.name}: ${S.zutaten.get(to).name}`);

    delete S.var.rezepte[r.id];
    varSpeichern();
    toast(names.length ? `Gilt jetzt für alle Rezepte · ${names.join(' · ')}` : 'Übernommen');
    viewDetail();

  const sRes = $('#swapReset');
  if (sRes) sRes.onclick = () => { delete S.var.rezepte[r.id]; varSpeichern(); toast('Zurückgesetzt'); viewDetail(); };
  if (S.delAsk) {
    $('#delNo').onclick = () => { S.delAsk = false; viewDetail(); };

async function kochmodus() {
  if (wl) { try { await wl.release(); } catch (e) {} wl = null; viewDetail(); return; }
  try {
    if (!navigator.wakeLock) throw new Error('nope');
    wl = await navigator.wakeLock.request('screen');
    wl.addEventListener('release', () => { wl = null; if (S.view === 'detail') viewDetail(); });
    toast('Der Bildschirm bleibt an, solange das Rezept offen ist.');
  } catch (e) {
    wl = null;
    toast('Das geht auf diesem Gerät hier nicht. Stell die Bildschirmsperre kurz länger.');
  }
  if (S.view === 'detail') viewDetail();
}
async function rezeptLoeschen(id) {
  if (!S.db) return toast('Löschen geht nur im geöffneten Kochbuch in Claude.');
  try {
    await delDoc('rezepte/' + id);
    if (S.var.rezepte[id]) { delete S.var.rezepte[id]; varSpeichern(); }
    const vorher = S.plan.eintraege.length;
    S.plan.eintraege = S.plan.eintraege.filter(e => e.rezept !== id);
    if (S.plan.eintraege.length !== vorher) planSpeichern();
    toast('Rezept gelöscht');
    go('rezepte');
  } catch (e) { toast(fehlerText(e)); }
}

function viewPlan() {
  const st = statusBlock();
  if (st) { main.innerHTML = `<section class="wrap page"><h2 class="page-title">Wochenplan</h2>${st}</section>`; return; }
  const E = S.plan.eintraege;
  if (!TAG_KEYS.includes(S.planTag) && S.planTag !== 'woche') S.planTag = heuteKey();
  const tab = S.planTag;
  const heute = heuteKey();
  const isDay = !!TAG_KURZ[tab];

function planHinzufuegen() {
  const a = S.planAdd, err = $('#paErr');
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (a.typ === 'rezept') {
    const r = S.rezepte.get(a.rezept);
    if (!r) return fail('Wähl ein Rezept aus.');
    const kochen = Math.max(0, Math.round(parseNum(a.kochen) ?? (+r.portionen || 1)));
    const essen = Math.max(0, parseNum(a.essen) ?? 1);
    S.plan.eintraege.push({ id: rand(), typ: 'rezept', tag: S.planTag, mahlzeit: a.mahlzeit, rezept: r.id, kochen, essen });
    toast(`${r.titel} · ${TAB_NAME[S.planTag]} · ${MZ_NAME[a.mahlzeit]}`);
    a.kochenTouched = false; a.kochen = ''; a.essen = 1;
  } else {
    const name = a.zutatName.trim();
    const id = findeZutat(name);
    if (!id) return fail(name ? `„${name}“ gibt es noch nicht. Leg die Zutat unter „Zutaten & Nährwerte“ an.` : 'Gib ein Lebensmittel ein.');
    const menge = parseNum(a.menge);
    if (!(menge > 0)) return fail('Gib eine Menge ein.');
    S.plan.eintraege.push({ id: rand(), typ: 'lebensmittel', tag: S.planTag, mahlzeit: a.mahlzeit, zutat: id, menge, einheit: a.einheit, einkaufen: !!a.einkaufen });
    toast(`${S.zutaten.get(id).name} · ${TAB_NAME[S.planTag]} · ${MZ_NAME[a.mahlzeit]}`);
    a.zutatName = ''; a.menge = '';
  }
  planSpeichern(); viewPlan();
}
function planAendern(f) {
  const e = S.plan.eintraege.find(x => x.id === f.dataset.peform); if (!e) return;
  const val = k => { const el = f.querySelector(`[data-pe="${k}"]`); return el ? (el.type === 'checkbox' ? el.checked : el.value) : undefined; };
  const tg = val('tag'); if (TAG_KEYS.includes(tg)) e.tag = tg;
  const mz = val('mahlzeit'); if (MZ_NAME[mz]) e.mahlzeit = mz;
  if (e.typ === 'lebensmittel') {
    const m = parseNum(val('menge')); if (m > 0) e.menge = m;
    const u = val('einheit'); if (EINHEITEN.includes(u)) e.einheit = u;
    e.einkaufen = !!val('einkaufen');
  } else {
    const k = parseNum(val('kochen')); if (k != null && k >= 0) e.kochen = Math.round(k);
    const es = parseNum(val('essen')); if (es != null && es >= 0) e.essen = es;
  }
  S.planEdit = null; planSpeichern(); viewPlan();
}

function updEinkauf() {

  const normal = items.filter(i => !i.basic);
  const basics = items.filter(i => i.basic);
  const extras = S.liste.extras || [];
  const total = normal.length + extras.length;
  const erledigt = normal.filter(i => S.liste.abgehakt[i.id]).length + extras.filter(x => x.done).length;
  const ne = S.plan.eintraege.length;
  $('#ekSum').textContent = ne
    ? `${erledigt} von ${total} erledigt · aus ${ne} ${ne === 1 ? 'Eintrag' : 'Einträgen'} im Wochenplan`

      <input class="cb" type="checkbox" data-key="${esc(i.id)}" ${S.liste.abgehakt[i.id] ? 'checked' : ''}>

  } else {
    for (const [k, name] of KATS) {
      const g = normal.filter(i => i.kat === k);
      if (g.length) html += `<section class="ek-group"><h3 class="grp-h">${esc(name)}</h3>${g.map(row).join('')}</section>`;
    }
    if (basics.length) {
      html += `<button class="btn basics-toggle" type="button" id="ekBasics" aria-expanded="${S.basicsZeigen}">${S.basicsZeigen ? 'Vorrat ausblenden' : `Vorrat prüfen: ${basics.length} Basics wie Öl, Salz, Gewürze`}</button>`;
      if (S.basicsZeigen) html += `<section class="ek-group"><h3 class="grp-h">Vorrat prüfen</h3>${basics.map(row).join('')}</section>`;
    }
  }
  $('#ekList').innerHTML = html;
  $('#ekExtras').innerHTML = extras.map(x => `<div class="extra-row ${x.done ? 'done' : ''}">
      <input class="cb" type="checkbox" id="ex-${esc(x.id)}" data-ex="${esc(x.id)}" ${x.done ? 'checked' : ''}>
      <label for="ex-${esc(x.id)}"><span class="ex-t">${esc(x.text)}</span></label>
      <button class="x" type="button" data-exdel="${esc(x.id)}" aria-label="${esc(x.text)} entfernen">×</button></div>`).join('');
}
function einkaufText() {
  const items = einkaufsItems();
  const lines = ['Einkaufsliste'];
  for (const [k, name] of KATS) {
    const g = items.filter(i => !i.basic && i.kat === k && !S.liste.abgehakt[i.id]);
    if (g.length) { lines.push('', name.toUpperCase()); g.forEach(i => lines.push(`- ${i.name}: ${i.menge}`)); }
  }
  const b = items.filter(i => i.basic && !S.liste.abgehakt[i.id]);
  if (b.length && S.basicsZeigen) { lines.push('', 'VORRAT PRÜFEN'); b.forEach(i => lines.push(`- ${i.name}: ${i.menge}`)); }
  const ex = (S.liste.extras || []).filter(x => !x.done);
  if (ex.length) { lines.push('', 'WEITERE ARTIKEL'); ex.forEach(x => lines.push('- ' + x.text)); }
  return lines.join('\n');
}

function zutatDaten(d, name, kcal) {
  const kat = d.kategorie || 'sonstiges';
  const data = { name, kategorie: kat, art: ART_NAME[d.art] ? d.art : (ART_DEFAULT[kat] || 'sonstiges'), kcal, protein: parseNum(d.protein) ?? 0, kh: parseNum(d.kh) ?? 0, fett: parseNum(d.fett) ?? 0, basic: !!d.basic };
  for (const k of ['gesFett', 'zucker', 'ballaststoffe', 'salz', 'omega3']) { const v = parseNum(d[k]); if (v != null && v >= 0) data[k] = v; }
  const stk = parseNum(d.gProStk); if (stk) data.gProStk = stk;
  const sn = String(d.stkName || '').trim(); if (sn) data.stkName = sn.slice(0, 20);
  const el = parseNum(d.gProEL); if (el) data.gProEL = el;
  const di = parseNum(d.dichte); if (di) data.dichte = di;
  if (d.zuckerZugesetzt) data.zuckerZugesetzt = true;
  if (d.trocken) data.trocken = true;
  const gr = String(d.gruppe || '').trim();
  if (gr) data.gruppe = gr.slice(0, 30);
  const qu = String(d.quelle || '').trim();
  if (qu) data.quelle = qu.slice(0, 140);
  return data;
}
function uniqueZutatId(name, extra) {
  const base = slug(name); let id = base, i = 2;
  while (S.zutaten.has(id) || extra.includes(id)) id = base + '-' + (i++);
  return id;
}

function lmExportieren() {

    a.href = url; a.download = `kochbuch-lebensmittel-${new Date().toISOString().slice(0, 10)}.json`;

async function lmImportieren(e) {

        </div>
        <div class="field"><label for="edTags">Kategorien, mit Komma getrennt</label><input id="edTags" type="text" value="${esc(ed.tags)}" placeholder="z. B. Hauptgericht, Meal Prep">
          ${tags.length ? `<div class="chips" id="edTagSug">${tags.map(t => `<button type="button" class="chip" data-addtag="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>` : ''}</div>
        <fieldset class="field">
          <legend>Zutaten</legend>
          <p class="hint">Menge, Einheit, Zutat. Brüche wie ½ oder 1/2 gehen auch. Ist eine Zutat neu, trägst du direkt ihre Nährwerte von der Packung ein.</p>
          <div class="rows" id="edRows"></div>
          <div><button type="button" class="btn" id="edAddRow">Zutat hinzufügen</button></div>
        </fieldset>
        <div class="field"><label for="edSchritte">Zubereitung, ein Schritt pro Zeile</label><textarea id="edSchritte" rows="9" placeholder="Zwiebel würfeln und in Öl glasig dünsten.&#10;Tomaten zugeben und 10 Minuten köcheln.">${esc(ed.schritte)}</textarea></div>
        <p class="err" id="edErr" role="alert" hidden></p>
        <div class="actions"><button class="btn btn-primary" type="submit" id="edSave">Rezept speichern</button><button class="btn btn-ghost" type="button" id="edCancel">Abbrechen</button></div>
      </div>
      <aside class="ed-side"><div class="preview" id="edPrev"></div></aside>
    </form>
    <datalist id="dlZutaten"></datalist>
    ${gruppenDatalist()}
  </section>`;
  const back = () => ed.id ? go('detail', ed.id) : go('rezepte');
  $('#edBack').onclick = back; $('#edCancel').onclick = back;
  const map = { edTitel: 'titel', edBeschr: 'beschreibung', edPort: 'portionen', edZeit: 'zeit', edTags: 'tags', edSchritte: 'schritte' };
  $('#edForm').addEventListener('input', e => { const k = map[e.target.id]; if (k) { ed[k] = e.target.value; if (k === 'portionen') updPreview(); } });
  const sug = $('#edTagSug');
  if (sug) sug.onclick = e => {
    const b = e.target.closest('[data-addtag]'); if (!b) return;
    const cur = ed.tags.split(',').map(s => s.trim()).filter(Boolean);
    if (!cur.includes(b.dataset.addtag)) cur.push(b.dataset.addtag);
    ed.tags = cur.join(', '); $('#edTags').value = ed.tags;
  };
  $('#edAddRow').onclick = () => { ed.rows.push(leereZeile()); renderRows(); const last = ed.rows[ed.rows.length - 1]; $(`#m-${last.key}`).focus(); };
  const rows = $('#edRows');
  rows.addEventListener('input', e => {
    const wrap = e.target.closest('[data-row]'); if (!wrap) return;
    const r = ed.rows.find(x => x.key === wrap.dataset.row); if (!r) return;
    const f = e.target.dataset.f;
    if (f && f.startsWith('neu.')) r.neu[f.slice(4)] = e.target.value;
    else if (f) r[f] = e.target.value;
    if (f === 'name') syncRow(r, wrap);
    updPreview();
  });
  rows.addEventListener('change', e => {
    const wrap = e.target.closest('[data-row]'); if (!wrap) return;
    const r = ed.rows.find(x => x.key === wrap.dataset.row); if (!r) return;
    const f = e.target.dataset.f;
    if (f === 'einheit') { r.einheit = e.target.value; syncRow(r, wrap); }
    if (f === 'neu.art') { r.neu.art = e.target.value; r.neu.artTouched = true; }
    if (f === 'neu.kategorie') {
      r.neu.kategorie = e.target.value;
      if (!r.neu.artTouched) { r.neu.art = ART_DEFAULT[r.neu.kategorie] || 'sonstiges'; const s = $(`#nr-${r.key}`); if (s) s.value = r.neu.art; }
    }
    updPreview();
  });
  rows.addEventListener('click', e => {
    const own = e.target.closest('[data-own]');
    if (own) {
      const r = ed.rows.find(x => x.key === own.closest('[data-row]').dataset.row), z = S.zutaten.get(own.dataset.own);
      if (r && z) { r.name = z.name; renderRows(); updPreview(); }
      return;
    }
    const hit = e.target.closest('[data-lm]');
    if (hit) {
      const r = ed.rows.find(x => x.key === hit.closest('[data-row]').dataset.row), o = LM.get(hit.dataset.lm);
      if (r && o) { lmAnwenden(r.neu, o); renderRows(); updPreview(); toast('Werte übernommen'); }
      return;
    }
    const b = e.target.closest('[data-rdel]'); if (!b) return;
    ed.rows = ed.rows.filter(x => x.key !== b.dataset.rdel);
    if (!ed.rows.length) ed.rows.push(leereZeile());
    renderRows(); updPreview();
  });
  $('#edForm').onsubmit = e => { e.preventDefault(); rezeptSpeichern(); };
  renderRows(); updDatalist(); updPreview();
  LM.laden();
}
function renderRows() {
  const ed = S.ed;
  $('#edRows').innerHTML = ed.rows.map(r => {
    const z = S.zutaten.get(findeZutat(r.name));
    const k = r.key;
    return `<div class="erow-wrap" data-row="${k}">
      <div class="erow">
        <input id="m-${k}" class="e-menge" data-f="menge" type="text" inputmode="decimal" aria-label="Menge" value="${esc(r.menge)}" placeholder="Menge">
        <select id="u-${k}" class="e-einheit" data-f="einheit" aria-label="Einheit">${EINHEITEN.map(e => `<option value="${e}" ${e === r.einheit ? 'selected' : ''}>${esc(einheitLabel(e, z))}</option>`).join('')}</select>
        <input id="n-${k}" class="e-name" data-f="name" type="text" list="dlZutaten" aria-label="Zutat" value="${esc(r.name)}" placeholder="Zutat" autocomplete="off">
        <input id="t-${k}" class="e-notiz" data-f="notiz" type="text" aria-label="Notiz" value="${esc(r.notiz)}" placeholder="Notiz, z. B. gewürfelt">
        <button type="button" class="x e-del" data-rdel="${k}" aria-label="Zeile entfernen">×</button>
      </div>
      <div class="eneu" hidden>
        <p><strong class="neuT"></strong> ist neu. Nährwerte pro 100 g, wie auf der Packung (nur kcal ist Pflicht):</p>
        <div class="dbs-mini"></div>
        ${r.neu.quelle ? `<p class="hint">Übernommen: ${esc(r.neu.quelle)}</p>` : ''}
        <div class="form-grid">
          ${NEU_FELDER.map(([f, l]) => `<label for="n${f}-${k}">${l}<input id="n${f}-${k}" data-f="neu.${f}" type="text" inputmode="decimal" value="${esc(r.neu[f])}"></label>`).join('')}
          <label for="na-${k}">Abteilung<select id="na-${k}" data-f="neu.kategorie">${KATS.map(([v, l]) => `<option value="${v}" ${r.neu.kategorie === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label for="nr-${k}">Art<select id="nr-${k}" data-f="neu.art">${ART.map(([v, l]) => `<option value="${v}" ${r.neu.art === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label for="ng-${k}">Austauschgruppe<input id="ng-${k}" data-f="neu.gruppe" type="text" list="dlGruppen" value="${esc(r.neu.gruppe)}" placeholder="optional, z. B. Nudeln"></label>
          <label for="ns-${k}">Gramm pro Stück<input id="ns-${k}" data-f="neu.gProStk" type="text" inputmode="decimal" value="${esc(r.neu.gProStk)}" placeholder="bei Einheit Stk"></label>
        </div>
      </div>
    </div>`;
  }).join('');
  ed.rows.forEach(r => syncRow(r, $(`[data-row="${r.key}"]`)));
}
function syncRow(r, wrap) {
  if (!wrap) return;
  const name = r.name.trim();
  const id = findeZutat(name);
  const z = id ? S.zutaten.get(id) : null;
  const neu = wrap.querySelector('.eneu');
  neu.hidden = !name || !!id;
  const t = wrap.querySelector('.neuT'); if (t) t.textContent = '„' + name + '“';
  const opt = wrap.querySelector('[data-f="einheit"] option[value="stk"]');
  if (opt) opt.textContent = einheitLabel('stk', z);
  if (!neu.hidden) planeVorschlaege(r);
  else { const bx = wrap.querySelector('.dbs-mini'); if (bx) bx.innerHTML = ''; }
}
const vorschlagT = new Map();
function planeVorschlaege(r) {
  clearTimeout(vorschlagT.get(r.key));
  vorschlagT.set(r.key, setTimeout(() => editorVorschlaege(r), 250));
}
async function editorVorschlaege(r) {
  const wrap = $(`[data-row="${r.key}"]`); if (!wrap) return;
  const box = wrap.querySelector('.dbs-mini'); if (!box) return;
  const name = r.name.trim();
  if (name.length < 3 || findeZutat(name)) { box.innerHTML = ''; return; }
  const eigene = sucheIn([...S.zutaten.values()].map(z => suchEintrag({ id: z.id, name: z.name })), name, { max: 3 });
  const eigenHtml = eigene.length ? `<p class="hint">Meintest du eine Zutat, die du schon hast?</p><div class="opts">${eigene.map(z => `<button type="button" class="opt" data-own="${esc(z.id)}">${esc(z.name)}</button>`).join('')}</div>` : '';
  if (LM.blsStatus !== 'ok') box.innerHTML = eigenHtml + '<p class="hint">Nährwert-Datenbank wird geladen …</p>';
  await LM.laden();
  if (!box.isConnected || r.name.trim() !== name) return;
  const hits = LM.suche(name, { max: 4, veg: S.vegFilter });
  if (!hits.length && LM.blsStatus === 'fehler') { box.innerHTML = eigenHtml; return; }
  box.innerHTML = eigenHtml + (hits.length ? `<p class="hint">Werte aus der Nährwert-Datenbank übernehmen:</p><ul class="dbs-list">${hits.map(hitHtml).join('')}</ul><p class="dbs-src">${BLS_HINWEIS}</p>` : '<p class="hint">Kein Treffer in der Nährwert-Datenbank.</p>');
}
function updDatalist() {
  const dl = $('#dlZutaten'); if (!dl) return;
  dl.innerHTML = [...S.zutaten.values()].map(z => z.name).sort((a, b) => a.localeCompare(b, 'de')).map(n => `<option value="${esc(n)}"></option>`).join('');
  if (S.view === 'editor' && S.ed) S.ed.rows.forEach(r => syncRow(r, $(`[data-row="${r.key}"]`)));
}
function editorZeilen() {
  return S.ed.rows.filter(r => r.name.trim()).map(r => {
    const id = findeZutat(r.name);
    return { zutat: id, name: r.name.trim(), menge: parseNum(r.menge), einheit: r.einheit, notiz: r.notiz.trim(), row: r };
  });
}
function editorGetZ(id, l) {
  if (id) return S.zutaten.get(id);
  const nk = parseNum(l.row.neu.kcal);
  if (nk == null) return null;
  const nz = { name: l.name, kcal: nk, kategorie: l.row.neu.kategorie, art: l.row.neu.art };
  for (const k of ['protein', 'kh', 'fett', 'gesFett', 'zucker', 'ballaststoffe', 'salz', 'omega3', 'gProStk']) { const v = parseNum(l.row.neu[k]); if (v != null) nz[k] = v; }
  if (l.row.neu.trocken) nz.trocken = true;
  if (l.row.neu.zuckerZugesetzt) nz.zuckerZugesetzt = true;
  return nz;
}
function updPreview() {
  const box = $('#edPrev'); if (!box || !S.ed) return;
  const lines = editorZeilen();
  const port = Math.max(1, parseNum(S.ed.portionen) || 1);
  const t = analyse(lines, editorGetZ);
  const pp = { kcal: t.kcal / port, p: t.p / port, k: t.k / port, f: t.f / port };
  const pr = lines.length ? profil(lines, port, editorGetZ) : null;
  box.innerHTML = `<div class="preview-h">Vorschau pro Portion</div>
    ${lines.length ? `<div class="big"><div><div class="kcal-big">${num(pp.kcal)}</div><div class="kcal-unit">kcal pro Portion</div></div>${ring(pp, 54)}</div>
    <div class="macros"><div><b>${num(pp.p)} g</b>Eiweiß</div><div><b>${num(pp.k)} g</b>Kohlenh.</div><div><b>${num(pp.f)} g</b>Fett</div></div>
    ${t.fehlt.length ? `<p class="warn">Noch ohne: ${esc([...new Set(t.fehlt)].join(', '))}</p>` : '<p class="label-foot">Alle Zutaten sind eingerechnet.</p>'}
    ${pr ? `<div class="ed-score">${S.ziele.gesamtZeigen ? scorePill(pr) + '<span>Gesamtnote</span>' : '<span>Profil</span>'}</div>
      <div class="crits">${skalenRows(pr, true)}</div>
      ${pr.tipps.length ? `<ul class="tipps">${pr.tipps.slice(0, 2).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}` : ''}`
    : '<p class="hint">Sobald du Zutaten einträgst, siehst du hier Kalorien und Profil einer Portion. So kannst du Varianten durchrechnen, bevor du speicherst.</p>'}`;
}
async function rezeptSpeichern() {
  const ed = S.ed;
  const err = $('#edErr');
  const fail = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  err.hidden = true;
  const titel = ed.titel.trim();
  if (!titel) return fail('Gib dem Rezept einen Namen.');
  const lines = editorZeilen();
  if (!lines.length) return fail('Trag mindestens eine Zutat ein.');
  if (!S.db) return fail('Speichern geht nur im geöffneten Kochbuch in Claude.');
  const neue = [];
  const neuNachName = new Map();
  for (const l of lines) {
    if (l.zutat) continue;
    const key = l.name.toLowerCase();
    if (neuNachName.has(key)) { l.zutat = neuNachName.get(key); continue; }
    const kcal = parseNum(l.row.neu.kcal);
    if (kcal == null) return fail(`Für „${l.name}“ fehlen die Kalorien pro 100 g.`);
    const id = uniqueZutatId(l.name, neue.map(n => n.id));
    neue.push({ id, data: zutatDaten(l.row.neu, l.name, kcal) });
    neuNachName.set(key, id);
    l.zutat = id;
  }
  const port = Math.max(1, Math.round(parseNum(ed.portionen) || 1));
  const zeit = parseNum(ed.zeit);
  const id = ed.id || (slug(titel) + '-' + rand());
  const alt = ed.id ? S.rezepte.get(ed.id) : null;
  const data = {
    titel: titel.slice(0, 120),
    beschreibung: ed.beschreibung.trim().slice(0, 400),
    portionen: port,
    zeit: zeit ? Math.round(zeit) : null,
    tags: [...new Set(ed.tags.split(',').map(s => s.trim()).filter(Boolean))].slice(0, 8),
    zutaten: lines.map(l => ({ zutat: l.zutat, menge: l.menge ?? '', einheit: l.einheit, notiz: l.notiz })),
    schritte: ed.schritte.split('\n').map(s => s.trim().replace(/^\d+[.)]\s*/, '')).filter(Boolean),
    erstellt: (alt && alt.erstellt) || new Date().toISOString(),
    geaendert: new Date().toISOString()
  };
  const btn = $('#edSave'); btn.disabled = true; btn.textContent = 'Speichert …';
  try {
    for (const n of neue) await setDoc('zutaten/' + n.id, n.data);
    await setDoc('rezepte/' + id, data);
    S.rezepte.set(id, { id, ...data });
    cacheV++;
    toast(ed.id ? 'Änderungen gespeichert' : 'Rezept gespeichert');
    S.ed = null;
    go('detail', id);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Rezept speichern';
    fail(fehlerText(e));
  }
}

/* ---------- Start ---------- */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view);
});
$('#btnNeu').onclick = neuesRezept;

(function hashStart() {
  let h = '';
  try { h = (location.hash || '').slice(1); } catch (e) {}
  if (VIEWS.includes(h)) S.view = h;
  else if (h.startsWith('r-')) { S.view = 'detail'; S.detailId = h.slice(2); }
})();
render();
// Die Lebensmittel-Datenbank meldet Änderungen selbst, unabhängig vom Speicher in Claude
LM.abonnieren(updLm);
LM.oeffnen().then(updLm);

function onErr(e) {
  if (e && e.code === 'revoked') toast('Der Speicher ist nicht mehr erreichbar.');
  else if (e && e.code === 'unavailable') toast('Verbindung unterbrochen. Lade die Seite neu.');
}

(async function init() {
  let db = null;
  try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; }
  catch (e) { db = null; }
  if (!db) { S.dbState = 'none'; render(); return; }
  S.db = db; S.dbState = 'ready';
  db.collection('rezepte').onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, { id: d.id, ...clone(d.data()) }));
    const erst = !S.loadedR;
    S.rezepte = m; S.loadedR = true; cacheV++;
    if (erst && S.loadedZ) render(); else refresh('r');
  }, onErr);
  db.collection('zutaten').onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, { id: d.id, ...clone(d.data()) }));
    const erst = !S.loadedZ;
    S.zutaten = m; S.loadedZ = true; rebuildIndex(); cacheV++;
    if (erst && S.loadedR) render(); else refresh('z');
  }, onErr);
  db.doc('plan/woche').onSnapshot(snap => {
    if (!ruhig('plan/woche')) return;
    const d = snap.exists ? clone(snap.data()) : {};
    S.plan = { eintraege: Array.isArray(d.eintraege) ? d.eintraege.map(normEntry).filter(Boolean) : [] };
    refresh('plan');
  }, onErr);
  db.doc('einkauf/liste').onSnapshot(snap => {
    if (!ruhig('einkauf/liste')) return;
    const d = snap.exists ? clone(snap.data()) : {};
    S.liste = { abgehakt: d.abgehakt && typeof d.abgehakt === 'object' ? d.abgehakt : {}, extras: Array.isArray(d.extras) ? d.extras : [] };
    refresh('liste');
  }, onErr);
  db.doc('einstellungen/ziele').onSnapshot(snap => {
    if (!ruhig('einstellungen/ziele')) return;
    S.ziele = mergeZiele(snap.exists ? clone(snap.data()) : null);
    refresh('ziele');
  }, onErr);
  db.doc('einstellungen/varianten').onSnapshot(snap => {
    if (!ruhig('einstellungen/varianten')) return;
    S.var = normVar(snap.exists ? clone(snap.data()) : null);
    refresh('var');
  }, onErr);
})();
})();
</script>

</body></html>
